<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Calendario dell'Avvento</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Calendario dell'Avvento</h1>
    <p class="conto" id="conto" aria-live="polite"></p>
  </header>

  <div class="layout">
    <!-- SINISTRA: giradischi + musica -->
    <section class="player" id="player" aria-label="Musica">
      <svg viewBox="0 0 300 260" role="img" aria-label="Giradischi">
        <rect x="8" y="8" width="284" height="244" rx="14" fill="#6b4630" stroke="#3f2819" stroke-width="3"/>
        <circle cx="125" cy="135" r="104" fill="#2b2b2b"/>
        <g class="vinile">
          <circle cx="125" cy="135" r="96" fill="#15110f"/>
          <circle cx="125" cy="135" r="86" fill="none" stroke="#2c2622"/>
          <circle cx="125" cy="135" r="74" fill="none" stroke="#2c2622"/>
          <circle cx="125" cy="135" r="62" fill="none" stroke="#2c2622"/>
          <circle cx="125" cy="135" r="50" fill="none" stroke="#2c2622"/>
          <path d="M125 135 L125 39 A96 96 0 0 1 193 67 Z" fill="#fff" opacity=".05"/>
          <circle cx="125" cy="135" r="30" fill="#9b2d3b" stroke="#d2a94f" stroke-width="2"/>
          <circle cx="125" cy="135" r="4" fill="#f3f0e8"/>
        </g>
        <circle cx="262" cy="45" r="16" fill="#3a3a3a" stroke="#d2a94f" stroke-width="2"/>
        <g class="braccio">
          <line x1="262" y1="45" x2="262" y2="165" stroke="#d9d4c4" stroke-width="6" stroke-linecap="round"/>
          <rect x="253" y="158" width="18" height="30" rx="3" fill="#d2a94f"/>
          <circle cx="262" cy="45" r="7" fill="#d9d4c4"/>
        </g>
      </svg>
      <button class="btn" id="btnMusica" type="button" aria-pressed="false">Avvia la musica</button>
      <p class="hint" id="hint"></p>
      <div id="yt" style="position:fixed;left:-9999px;width:200px;height:200px" aria-hidden="true"></div>
    </section>

    <!-- CENTRO: calendario (le caselle vengono create da js/calendario.js) -->
    <main class="calendario-col">
      <div class="calendario" id="calendario"><div class="griglia" id="griglia"></div></div>
    </main>

    <!-- DESTRA: calendario 2025 -->
    <aside class="archivio">
      <h2>Calendario 2025</h2>
      <p>Ti sei perso qualche sorpresa dello scorso anno? Riapri tutte le caselle del calendario dell'Avvento 2025.</p>
      <a class="btn" id="link2025" href="#">Vai al calendario 2025</a>
    </aside>
  </div>

  <script src="js/config.js"></script>
  <script src="js/comune.js"></script>
  <script src="js/calendario.js"></script>
</body>
</html>
